[project]
name = "itp-studio"
version = "0.1.0"
description = "Domestic-provider image-to-pose and 3D workspace"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic-settings>=2.8,<3",
  "python-multipart>=0.0.20,<1",
  "pillow>=11.1,<13",
  "httpx>=0.28,<1",
  "numpy>=2.2,<3",
  "onnxruntime>=1.20,<2",
  "tencentcloud-sdk-python-ai3d>=3.0.1400,<4",
  "filelock>=3.18,<4",
  "cryptography>=44,<47",
  "qrcode>=8,<9",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/itp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# `tests/test_flux_klein_service.py` imports the vendored `services` package by
# repository-relative name, so the project root must be importable when pytest
# runs as a console script.
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/itp/api.py" = ["B008"]
