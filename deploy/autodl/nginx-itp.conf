server {
    listen 6006;
    server_name _;
    server_tokens off;
    client_max_body_size 12m;

    auth_basic "ITP Studio";
    auth_basic_user_file /etc/nginx/itp.htpasswd;

    # These routes require a merchant JWT in FastAPI. Basic auth cannot also
    # consume the same Authorization header. Registration and login are NOT
    # included, and remain behind the site password alongside all other paths.
    location ~ ^/api/merchant/(me|password|garments|looks)(/|$) {
        auth_basic off;
        client_max_body_size 81m;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host 127.0.0.1:8000;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }

    location = /api/settings {
        # PATCH is still protected by the server-level Basic Authentication.
        # The application additionally validates the browser Origin.
        limit_except GET PATCH { deny all; }
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host 127.0.0.1:8000;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host 127.0.0.1:8000;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }
}
