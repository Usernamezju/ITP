server {
    listen 6006;
    server_name _;
    server_tokens off;
    client_max_body_size 12m;

    auth_basic "ITP Studio";
    auth_basic_user_file /etc/nginx/itp.htpasswd;

    # Unified account endpoints use the existing JWT scheme. Login/registration
    # are public and rate-limited by FastAPI; protected account routes require
    # Bearer auth. Keep the legacy shared-workspace gate until asset isolation.
    location ~ ^/api/(auth/(register|login|logout)|account/(me|password|commerce|ledger|orders))(/|$) {
        auth_basic off;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host 127.0.0.1:8000;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 75s;
    }

    # These routes require a merchant JWT in FastAPI. Basic auth cannot also
    # consume the same Authorization header. Registration and login are NOT
    # included, and remain behind the site password alongside all other paths.
    location ~ ^/api/merchant/(me|password|garments|looks)(/|$) {
        auth_basic off;
        client_max_body_size 81m;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host 127.0.0.1:8000;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }

    location = /api/settings {
        # Model credentials are operator-owned, never customer configuration.
        return 404;
    }

    # Prices are public business data; account pages may send a Bearer token.
    location = /api/pricing {
        auth_basic off;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host 127.0.0.1:8000;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Official callbacks authenticate by signature, not a website password.
    location ~ ^/api/payments/(methods$|callbacks/(alipay|wechat|mock)$) {
        auth_basic off;
        client_max_body_size 128k;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host 127.0.0.1:8000;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 75s;
    }

    # Paid modeling endpoints validate JWTs in FastAPI, not the legacy Basic gate.
    location ~ ^/api/(jobs(/|$)|tryons/[^/]+/continue$) {
        auth_basic off;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host 127.0.0.1:8000;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 75s;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host 127.0.0.1:8000;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }
}
