server {
    listen 6006;
    server_name _;
    server_tokens off;
    client_max_body_size 12m;

    location ~ ^/api/(account/storage|model-assets|outfits/recommend)(/|$) {
        client_max_body_size 151m;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host 127.0.0.1:8000;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Public registration/login and JWT-protected account routes use FastAPI auth.
    location ~ ^/api/(auth/(register|login|logout)|account/(me|password|commerce|ledger|orders))(/|$) {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host 127.0.0.1:8000;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 75s;
    }

    # Merchant business routes require a merchant JWT and ownership in FastAPI.
    location ~ ^/api/merchant/(me|password|garments|looks|analytics)(/|$) {
        client_max_body_size 81m;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host 127.0.0.1:8000;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }

    # Legacy shared measurements must never be exposed on the public proxy.
    location = /api/body-profile {
        return 404;
    }

    location = /api/settings {
        # Model credentials are operator-owned, never customer configuration.
        return 404;
    }

    # Prices are public business data; account pages may send a Bearer token.
    location = /api/pricing {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host 127.0.0.1:8000;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Official callbacks authenticate by signature, not a website password.
    location ~ ^/api/payments/(methods$|callbacks/(alipay|wechat|mock)$) {
        client_max_body_size 128k;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host 127.0.0.1:8000;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 75s;
    }

    # The read-only admin console requires an admin JWT in FastAPI.
    location ~ ^/api/admin(/|$) {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host 127.0.0.1:8000;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 75s;
    }

    # Paid modeling endpoints validate JWTs in FastAPI.
    location ~ ^/api/(jobs(/|$)|tryons/[^/]+/continue$) {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host 127.0.0.1:8000;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 75s;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host 127.0.0.1:8000;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }
}
